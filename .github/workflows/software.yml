name: Software workflow gates
on: [push, pull_request]
jobs:
  local-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-app.txt
      - run: python -m pip install -r requirements-app.txt
      - run: python -m pytest tests/test_site_workflow.py tests/test_jobs.py tests/test_use_review.py tests/test_use_experiment.py tests/test_uavpal.py tests/test_parcels.py tests/test_hosting.py -q
      - run: python -m backend.smoke
      - run: python -m compileall -q backend
